<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de voces en inglés</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f3ff; color: #1f1b4d; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; border: 2px solid #c7c2f0; border-radius: 10px; background: #fff; }
  .voz { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .voz span { flex: 1; font-size: 15px; }
  .voz small { display: block; color: #6b6890; }
  button { font-size: 16px; padding: 10px 14px; border: 0; border-radius: 10px; background: #4a3fcf; color: #fff; }
  #aviso { margin-top: 12px; color: #a33; }
</style>
</head>
<body>
<h1>🔊 Prueba de voces en inglés</h1>

<label for="frase">Frase (puedes cambiarla)</label>
<input id="frase" value="It's half past two. Where were you yesterday? I could swim when I was five.">

<label for="elegida">Voz que acabas de oír (dime este nombre)</label>
<input id="elegida" readonly placeholder="Pulsa 🔊 en una voz">

<p id="aviso"></p>
<div id="lista"></div>

<script>
  const lista = document.getElementById('lista');
  const frase = document.getElementById('frase');
  const elegida = document.getElementById('elegida');
  const aviso = document.getElementById('aviso');

  function pintar() {
    const voces = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith('en'));
    lista.innerHTML = '';
    if (!voces.length) { aviso.textContent = 'No se ven voces en inglés (si acabas de abrir la página, espera un segundo y recarga).'; return; }
    aviso.textContent = '';
    voces.forEach((v) => {
      const fila = document.createElement('div');
      fila.className = 'voz';
      const texto = document.createElement('span');
      texto.textContent = v.name;
      const detalle = document.createElement('small');
      detalle.textContent = `${v.lang}${v.localService ? '' : ' · en línea'}`;
      texto.appendChild(detalle);
      const boton = document.createElement('button');
      boton.textContent = '🔊';
      boton.addEventListener('click', () => {
        speechSynthesis.cancel();
        const dicho = new SpeechSynthesisUtterance(frase.value);
        dicho.voice = v; dicho.lang = v.lang; dicho.rate = 0.9;
        elegida.value = `${v.name} (${v.lang})`;
        speechSynthesis.speak(dicho);
      });
      fila.append(texto, boton);
      lista.appendChild(fila);
    });
  }

  if (!('speechSynthesis' in window)) aviso.textContent = 'Este navegador no puede leer en voz alta.';
  else { pintar(); speechSynthesis.addEventListener('voiceschanged', pintar); }
</script>
</body>
</html>
